<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="梦屿：私人梦境记录、双轨解读、长期洞察与创作工作室。"
    />
    <meta name="theme-color" content="#f5efe4" />
    <title>梦屿 · 私人梦境档案</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5efe4;
        color: #27231f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 28%, #fff9ee 0, transparent 34rem),
          #f5efe4;
        z-index: 0;
      }

      .loading-card {
        text-align: center;
      }

      .loading-card strong {
        display: block;
        margin-bottom: 0.75rem;
        font-family: Georgia, "Songti SC", serif;
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .loading-card span {
        color: #776e64;
        font-size: 0.95rem;
      }

      iframe {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f5efe4;
      }

      .fallback {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 2;
        border: 1px solid rgb(58 49 39 / 14%);
        border-radius: 999px;
        padding: 0.65rem 0.9rem;
        background: rgb(255 252 246 / 88%);
        color: #554c43;
        font-size: 0.78rem;
        text-decoration: none;
        box-shadow: 0 8px 24px rgb(76 61 43 / 10%);
        backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body>
    <div class="loading" aria-hidden="true">
      <div class="loading-card">
        <strong>梦屿</strong>
        <span>正在进入你的私人梦境档案……</span>
      </div>
    </div>
    <iframe
      title="梦屿 · 私人梦境档案"
      src="https://mengyu-dream-journal.chitaoma.chatgpt.site/"
      allow="microphone; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <a
      class="fallback"
      href="https://mengyu-dream-journal.chitaoma.chatgpt.site/"
      target="_blank"
      rel="noreferrer"
    >
      无法显示？打开原网站
    </a>
  </body>
</html>
